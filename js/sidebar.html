<style>
  /* Sidebar Container */
  .app-sidebar {
    position: fixed;
    top: var(--header-height);
    left: 0;
    bottom: 0;
    width: var(--sidebar-width);
    background-color: var(--bg-sidebar); /* #ffffff in Light mode */
    border-right: 1px solid var(--border-color);
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  /* Mobile Backdrop Overlay */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background-color: var(--modal-bg);
    backdrop-filter: blur(4px);
    z-index: 1999;
  }

  /* Sidebar Navigation Menu List */
  .sidebar-menu-wrapper {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
  }

  .sidebar-menu-wrapper::-webkit-scrollbar {
    width: 4px;
  }
  .sidebar-menu-wrapper::-webkit-scrollbar-thumb {
    background-color: var(--border-color);
    border-radius: 10px;
  }

  .sidebar-menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .sidebar-item-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9.5px 14px;
    color: var(--text-sidebar); /* #64748b */
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-md);
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .sidebar-item-link:hover {
    background-color: var(--bg-body);
    color: var(--text-main);
  }

  /* VRTX Active Style: Soft Blue BG + Primary Blue Text */
  .sidebar-item-link.active {
    background-color: var(--bg-sidebar-active); /* #eff6ff in Light mode */
    color: var(--text-sidebar-active) !important; /* #2563eb in Light mode */
    font-weight: 600;
  }

  .sidebar-icon-wrap {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Mobile Sidebar Close Button Header */
  .sidebar-mobile-header {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-main);
  }

  .mobile-close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mobile-close-btn:hover {
    color: var(--text-main);
    background-color: var(--bg-body);
  }

  /* Mobile Bottom User Info */
  .sidebar-footer-mobile {
    display: none; /* Hidden on Desktop */
    padding: 14px 16px;
    border-top: 1px solid var(--border-color);
    background-color: var(--bg-body);
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-user-card {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--primary);
  }

  .sidebar-user-details {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  .sidebar-username-handle {
    font-size: 11px;
    color: var(--text-muted);
  }

  .btn-sidebar-logout {
    width: 100%;
    padding: 7px 12px;
    background-color: var(--danger-light);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-sidebar-logout:hover {
    background-color: var(--danger);
    color: #ffffff;
  }

  @media (max-width: 1024px) {
    .app-sidebar {
      top: 0;
      width: 270px;
      z-index: 2000;
      transform: translateX(-100%);
    }

    .app-sidebar.sidebar-mobile-open {
      transform: translateX(0) !important;
    }

    .sidebar-backdrop.active {
      display: block;
    }

    .sidebar-mobile-header {
      display: flex;
    }

    .sidebar-footer-mobile {
      display: flex;
    }
  }
</style>

<script>
  // Mobile Sidebar Open/Close Toggle
  function toggleMobileSidebar() {
    const sidebar = document.getElementById('app-sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    
    if (sidebar) sidebar.classList.toggle('sidebar-mobile-open');
    if (backdrop) backdrop.classList.toggle('active');
  }

  function closeMobileSidebar() {
    const sidebar = document.getElementById('app-sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    
    if (sidebar) sidebar.classList.remove('sidebar-mobile-open');
    if (backdrop) backdrop.classList.remove('active');
  }

  // Highlight Active Link in Sidebar
  function updateActiveSidebar(pageId) {
    const links = document.querySelectorAll('.sidebar-item-link');
    links.forEach(l => l.classList.remove('active'));

    const activeNav = document.getElementById('nav-' + pageId);
    if (activeNav) {
      activeNav.classList.add('active');
    }
  }
</script>
