<!-- ===================================================
     EDU PORTAL - FIXED WHITE HEADER (header.html)
     =================================================== -->

<style>
  .app-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--header-height);
    background-color: var(--bg-header); /* #ffffff in Light Mode */
    border-bottom: 1px solid var(--border-color);
    color: var(--text-main);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  }

  /* Left Header Group */
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .mobile-toggle-btn {
    display: none; /* Hidden on Desktop */
    background: none;
    border: none;
    color: var(--text-main);
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
    align-items: center;
    justify-content: center;
  }

  .mobile-toggle-btn:hover {
    background-color: var(--primary-light);
    color: var(--primary);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-main);
  }

  .header-logo-icon {
    width: 34px;
    height: 34px;
    background-color: var(--primary);
    color: #ffffff;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .header-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-main);
    white-space: nowrap;
  }

  /* Center Header Group (Global Search) */
  .header-center {
    flex: 1;
    max-width: 480px;
    margin: 0 16px;
  }

  .global-search-box {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  .global-search-icon {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .global-search-input {
    width: 100%;
    height: 36px;
    padding: 6px 12px 6px 38px;
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    color: var(--text-main);
    font-size: 13px;
    outline: none;
    transition: all 0.2s ease;
  }

  .global-search-input::placeholder {
    color: var(--text-muted);
  }

  .global-search-input:focus {
    background-color: var(--bg-surface);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  /* Right Header Group */
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Theme Toggle Button */
  .theme-btn {
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .theme-btn:hover {
    background-color: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
  }

  /* Desktop User Menu (Desktop View Only) */
  .desktop-user-menu {
    position: relative;
    display: flex;
    align-items: center;
  }

  .user-profile-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    padding: 4px 10px 4px 5px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .user-profile-btn:hover {
    background-color: var(--primary-light);
    border-color: var(--primary);
  }

  .user-avatar-img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--primary);
  }

  .user-name-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
  }

  /* User Dropdown Box */
  .user-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 170px;
    background-color: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    padding: 6px;
    z-index: 1001;
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .dropdown-item:hover {
    background-color: var(--danger-light);
    color: var(--danger);
  }

  /* Mobile Responsive Adjustments */
  @media (max-width: 1024px) {
    .mobile-toggle-btn {
      display: flex; /* Mobile hamburger button visible */
    }

    .desktop-user-menu {
      display: none !important; /* Mobile view hides desktop user menu, shown in mobile sidebar footer */
    }

    .header-center {
      margin: 0 10px;
    }

    .header-title {
      font-size: 16px;
    }
  }

  @media (max-width: 576px) {
    .header-center {
      display: none; /* Small screens hide global search bar */
    }
  }
</style>

<header class="app-header">
  
  <!-- LEFT: HAMBURGER (MOBILE ONLY) + LOGO + NAME -->
  <div class="header-left">
    <!-- Hamburger Toggle Button for Mobile View -->
    <button class="mobile-toggle-btn" id="mobile-menu-btn" onclick="toggleMobileSidebar()" title="Toggle Menu">
      <svg class="icon" style="width:22px; height:22px;" viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>

    <!-- Website Logo & Name -->
    <a href="javascript:void(0)" onclick="navigateTo('dashboard')" class="header-brand">
      <div class="header-logo-icon">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
        </svg>
      </div>
      <span class="header-title">Edu Portal</span>
    </a>
  </div>

  <!-- MIDDLE: GLOBAL SEARCH BAR -->
  <div class="header-center">
    <div class="global-search-box">
      <svg class="icon global-search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" class="global-search-input" placeholder="Search anything..." id="global-search-input">
    </div>
  </div>

  <!-- RIGHT: DARK MODE TOGGLE + USER PROFILE (DESKTOP ONLY) -->
  <div class="header-right">
    
    <!-- Dark Mode Toggle -->
    <button class="theme-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
      </svg>
    </button>

    <!-- Desktop User Profile Dropdown (Only Visible on Desktop View) -->
    <div class="desktop-user-menu">
      <div class="user-profile-btn" onclick="toggleHeaderUserDropdown(event)">
        <img id="header-user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="user-avatar-img" alt="User">
        <span id="header-user-name" class="user-name-text">User</span>
        <svg class="icon" style="width:16px; height:16px; color:var(--text-muted);" viewBox="0 0 24 24">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
        </svg>
      </div>

      <!-- Dropdown Menu -->
      <div id="header-user-dropdown" class="user-dropdown-menu hidden">
        <div class="dropdown-item" onclick="handleLogout()">
          <svg class="icon" style="color:var(--danger);" viewBox="0 0 24 24">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg>
          <span>Logout</span>
        </div>
      </div>
    </div>

  </div>

</header>

<script>
  function toggleHeaderUserDropdown(e) {
    e.stopPropagation();
    const dropdown = document.getElementById('header-user-dropdown');
    if (dropdown) dropdown.classList.toggle('hidden');
  }

  document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('header-user-dropdown');
    if (dropdown && !dropdown.classList.contains('hidden')) {
      dropdown.classList.add('hidden');
    }
  });

  function updateHeaderAndSidebarUserInfo() {
    const user = window.AppState.currentUser;
    if (user) {
      const headerName = document.getElementById('header-user-name');
      const headerImg = document.getElementById('header-user-img');
      
      if (headerName) headerName.innerText = user.fullName || user.username;
      if (headerImg) headerImg.src = user.imageUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

      const sidebarName = document.getElementById('sidebar-user-name');
      const sidebarUsername = document.getElementById('sidebar-username-handle');
      const sidebarImg = document.getElementById('sidebar-user-img');

      if (sidebarName) sidebarName.innerText = user.fullName || user.username;
      if (sidebarUsername) sidebarUsername.innerText = '@' + user.username;
      if (sidebarImg) sidebarImg.src = user.imageUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
    }
  }
</script>
